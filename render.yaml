services:
  # Node.js + Express Backend Dynamic Web Service
  - type: web
    name: citizencivic-backend
    runtime: node
    rootDir: server
    buildCommand: "npm install && npm run build"
    startCommand: "npm run start"
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "https://citizencivic-frontend.onrender.com,http://localhost:5173"
      - key: MEDIA_STORAGE_BACKEND
        value: "local"
      - key: AWS_STORAGE_BUCKET_NAME
        value: "assets"
      - key: AWS_REGION
        value: "ap-southeast-1"
      - key: AWS_ENDPOINT_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

  # React Frontend Static Site
  - type: web
    name: citizencivic-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://citizencivic.onrender.com"
