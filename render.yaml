services:
  # Django Backend API Web Service
  - type: web
    name: citizencivic-backend
    runtime: python
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn citizencivic.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: "localhost,127.0.0.1,.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://citizencivic-frontend.onrender.com,http://localhost:5173"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com,http://localhost:5173"

  # React Frontend Static Site
  - type: web
    name: citizencivic-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://citizencivic.onrender.com"
      - key: VITE_NEON_REALTIME_URL
        value: "https://br-floral-bird-aoi9ledz-neonrealtimesocket.compute.c-2.ap-southeast-1.aws.neon.tech/"
      - key: VITE_NEON_REALTIME_WS
        value: "wss://br-floral-bird-aoi9ledz-neonrealtimesocket.compute.c-2.ap-southeast-1.aws.neon.tech/"
